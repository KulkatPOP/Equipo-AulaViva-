name: AulaViva S08 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  iac-scan:
    name: Escaneo de infraestructura con Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar Checkov
        run: python -m pip install checkov==3.2.495

      - name: Escanear Terraform y reglas propias
        run: |
          mkdir -p evidence
          checkov -d terraform --framework terraform --external-checks-dir security/checkov --output json > evidence/checkov.json
          python -c "import json; r=json.load(open('evidence/checkov.json')); assert r['summary']['passed'] > 0, 'No se evaluaron controles'"

      - name: Guardar informe de infraestructura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-report
          path: evidence/checkov.json
          if-no-files-found: error

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  quality:
    name: PHPUnit, cobertura y seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar PHP 8.2 y Xdebug
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Comprobar sintaxis PHP
        shell: bash
        run: |
          find api config -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Ejecutar PHPUnit y generar cobertura real
        shell: bash
        run: |
          XDEBUG_MODE=coverage vendor/bin/phpunit \
            --no-progress \
            --coverage-text \
            --coverage-clover coverage.xml

      - name: Exigir cobertura minima del 70%
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          metrics = root.find("./project/metrics")

          if metrics is None:
              raise SystemExit("ERROR: no se encontraron metricas de cobertura")

          total = int(metrics.attrib["statements"])
          covered = int(metrics.attrib["coveredstatements"])

          if total == 0:
              raise SystemExit("ERROR: no hay lineas para medir")

          coverage = covered / total * 100

          print(f"Cobertura real: {coverage:.2f}% ({covered}/{total})")

          if coverage < 70:
              raise SystemExit("ERROR: cobertura inferior al 70%")

          print("OK: cobertura minima superada")
          PY

  build-and-push:
    name: Construir imagen Docker
    needs: [quality, security, iac-scan]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Iniciar sesion en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kulkatpop/aulaviva-api:${{ github.sha }}

  supply-chain:
    name: Controles S10
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-ref: ghcr.io/kulkatpop/aulaviva-api:${{ github.sha }}
      image-digest: ${{ needs.build-and-push.outputs.image-digest }}

  promote:
    name: Actualizar repositorio GitOps
    needs: [build-and-push, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio GitOps
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kevinramosr/AulaViva-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Actualizar imagen de DEV
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("overlays/dev/kustomization.yaml")
          content = path.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*newTag:\s*).*$",
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
          )

          if count != 1:
              raise SystemExit("No se encontro exactamente un newTag en DEV")

          path.write_text(updated)
          PY

      - name: Crear Pull Request en GitOps
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          branch: automation/update-dev-image
          delete-branch: true
          commit-message: "chore(gitops): actualizar imagen DEV"
          title: "chore(gitops): actualizar imagen AulaViva DEV"
          body: |
            Promocion automatica generada desde AulaViva S08.

            Imagen: ghcr.io/kulkatpop/aulaviva-api:${{ github.sha }}

            Entorno: DEV
          base: main
