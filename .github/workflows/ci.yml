name: AulaViva S08 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run each gate even if another gate fails, preserving every failure.
      - name: OpenAPI lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for file in package.json package-lock.json .spectral.yaml api/openapi.yaml; do
            if [ ! -f "$file" ]; then
              echo "::error::OpenAPI lint bloqueado: falta $file en esta revisión."
              exit 1
            fi
          done
          npm ci
          npx --no-install spectral lint api/openapi.yaml --ruleset .spectral.yaml

      - name: Application lint - blocked
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "::error::Lint de aplicación bloqueado: Desarrollo debe proporcionar herramienta, dependencias, configuración y comando verificado para PHP."
          exit 1

      - name: Tests - blocked
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "::error::Tests bloqueados: faltan suite real, runner, dependencias y comando verificado de Desarrollo/QA. El npm test encontrado en otras ramas es un placeholder que falla."
          exit 1

      - name: Coverage >=70% - blocked
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "::error::Cobertura bloqueada: QA debe proporcionar configuración, reporte y comprobación que falle por debajo de 70% o ante reporte ausente/inválido."
          exit 1

      - name: Semgrep SAST
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -z "$(git ls-files '*.php')" ]; then
            echo "::error::Semgrep PHP bloqueado: esta revisión no contiene código PHP versionado que analizar."
            exit 1
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.99.0 \
            semgrep scan --config p/php --error --metrics=off .

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tagged with full commit SHA
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "ref=ghcr.io/kulkatpop/aulaviva:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and conditionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Replace this blocker only after the GitOps destination and access exist.
      # The future change must reference these build outputs in the dev overlay
      # and require review; it must not deploy to Kubernetes or auto-merge.
      - name: GitOps promotion - blocked
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          echo "::error::Promoción bloqueada: faltan repositorio GitOps, rama destino, overlay Kustomize, credencial autorizada y mecanismo de cambio revisable."
          exit 1
