name: AulaViva S09 Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/s08-cicd-gitops

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar directorio de reportes
        run: mkdir -p "$RUNNER_TEMP/semgrep"

      - name: Ejecutar Semgrep SAST
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/semgrep:/reports" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
            --config p/owasp-top-ten \
            --config .semgrep/php-sql-http-input.yml \
            --config .semgrep/php-hardcoded-secret.yml \
            --sarif \
            --output /reports/semgrep.sarif \
            --error \
            --metrics=off

      - name: Publicar reporte Semgrep
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: ${{ runner.temp }}/semgrep/semgrep.sarif
          if-no-files-found: warn
