name: AulaViva S09 Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install semgrep==1.161.0

      - name: Probar las reglas propias
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep-tests"
          cp .semgrep/*.yaml tests/semgrep/*.php "$RUNNER_TEMP/semgrep-tests/"
          semgrep scan --test "$RUNNER_TEMP/semgrep-tests"

           - name: Bloquear hallazgos SAST
             run: |
          semgrep scan --error --strict --metrics=off --disable-nosem \
            --json-output "$RUNNER_TEMP/semgrep-report.json" \
            --config p/owasp-top-ten --config p/php --config .semgrep/ \
            --exclude tests/semgrep/ .

      - name: Guardar informe Semgrep
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep-report.json
          if-no-files-found: error

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Trivy
        env:
          TRIVY_VERSION: '0.70.0'
        run: |
          archivo="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$base/$archivo"
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  $archivo" | sha256sum --check
          mkdir -p bin
          tar -xzf "$archivo" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generar inventarios CycloneDX y SPDX
        run: |
          trivy fs --include-dev-deps --format cyclonedx --output "$RUNNER_TEMP/sbom.json" .
          trivy fs --include-dev-deps --format spdx-json --output "$RUNNER_TEMP/sbom.spdx.raw.json" .
          jq '(.packages[] | select(.downloadLocation == "git+.").downloadLocation) = "NOASSERTION"' \
            "$RUNNER_TEMP/sbom.spdx.raw.json" > "$RUNNER_TEMP/sbom.spdx.json"
          jq -e '.bomFormat == "CycloneDX"
            and any(.components[]; (.purl // "") | startswith("pkg:composer/"))
            and any(.components[]; (.purl // "") | startswith("pkg:npm/"))' "$RUNNER_TEMP/sbom.json"
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | length > 0)' "$RUNNER_TEMP/sbom.spdx.json"

      - name: Publicar inventarios
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            ${{ runner.temp }}/sbom.json
            ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error

      - name: Generar informe de vulnerabilidades
        run: |
          trivy fs --scanners vuln --include-dev-deps --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-report.json" .

      - name: Publicar informe de vulnerabilidades
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sca-report
          path: ${{ runner.temp }}/trivy-report.json
          if-no-files-found: error

      - name: Bloquear vulnerabilidades altas o críticas con parche
        run: |
          trivy fs --scanners vuln --include-dev-deps --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.0'
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$base/$archivo"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archivo" | sha256sum --check
          mkdir -p bin
          tar -xzf "$archivo" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Escanear historial con Gitleaks
        run: gitleaks git . --log-opts="--all HEAD --full-history" --redact=100 --exit-code=1
