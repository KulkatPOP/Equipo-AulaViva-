name: AulaViva S09 Security

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - feature/s08-cicd-gitops

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

           - name: Ejecutar Semgrep SAST
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/semgrep:/reports" \
            --workdir /src \
            semgrep/semgrep \
            semgrep scan \
            --config p/owasp-top-ten \
            --config .semgrep/php-sql-http-input.yml \
            --config .semgrep/php-hardcoded-secret.yml \
            --sarif \
            --output /reports/semgrep.sarif \
            --error \
            --metrics=off

          cp "$RUNNER_TEMP/semgrep/semgrep.sarif" "$GITHUB_WORKSPACE/semgrep.sarif"
      - name: Publicar reporte Semgrep
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
