apiVersion: apps/v1
kind: Deployment
metadata:
  name: aulaviva-api
  labels:
    app: aulaviva
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aulaviva
  template:
    metadata:
      labels:
        app: aulaviva
    spec:
      containers:
        - name: api
          image: ghcr.io/tu-equipo/aulaviva-api@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: aulaviva-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
