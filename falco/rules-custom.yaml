- list: aulaviva_approved_outbound_ports
  items: [53, 3306, 443]
- macro: aulaviva_workload
  condition: (container.id != host and k8s.ns.name = aulaviva)
- rule: AulaViva interactive shell
  desc: Shell interactiva en el namespace educativo
  condition: aulaviva_workload and spawned_process and proc.name in (bash, sh, dash, zsh) and proc.tty != 0
  output: "AulaViva shell (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name command=%proc.cmdline container=%container.id)"
  priority: CRITICAL
  tags: [aulaviva, incident, shell]
- rule: AulaViva write configuration
  desc: Escritura inesperada bajo /etc
  condition: aulaviva_workload and open_write and fd.name startswith /etc/
  output: "AulaViva config write (user=%user.name pod=%k8s.pod.name file=%fd.name command=%proc.cmdline container=%container.id)"
  priority: ERROR
  tags: [aulaviva, incident, persistence]
- rule: AulaViva unexpected outbound port
  desc: Conexion saliente fuera de DNS MySQL y HTTPS
  condition: aulaviva_workload and evt.type = connect and evt.dir = < and evt.rawres >= 0 and fd.typechar in (4, 6) and not fd.rport in (aulaviva_approved_outbound_ports)
  output: "AulaViva outbound (pod=%k8s.pod.name connection=%fd.name command=%proc.cmdline container=%container.id)"
  priority: ERROR
  tags: [aulaviva, incident, network]
