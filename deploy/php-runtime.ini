; Match the existing 10 MiB PDF contract, including multipart overhead.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
; Tutor allows up to 120 seconds; retain margin for request processing.
max_execution_time = 130
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
; Preserve the current UTC interpretation of timestamps.
date.timezone = UTC
