ServerTokens Prod
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
<Directory /var/www/html>
    Options -Indexes
</Directory>
<DirectoryMatch "^/var/www/html/(config|docs|deploy|terraform|k8s|falco|scripts|packages|vendor|tests)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json|Dockerfile|.*\.md|.*\.yml|.*\.yaml|.*\.tf|.*\.lock|\..*)$">
    Require all denied
</FilesMatch>
