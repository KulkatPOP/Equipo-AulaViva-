rules:
  - id: aula-viva-php-hardcoded-secret
    languages:
      - php
    message: "Evita almacenar secretos directamente en el código PHP. Utiliza variables de entorno o un gestor de secretos."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $PASSWORD = "...";
          - pattern: $API_KEY = "...";
          - pattern: $APIKEY = "...";
          - pattern: $SECRET = "...";
          - pattern: $TOKEN = "...";
          - pattern: $CLIENT_SECRET = "...";
