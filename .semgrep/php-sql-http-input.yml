rules:
  - id: aula-viva-php-sql-http-input
    languages:
      - php
    message: "No uses entrada HTTP directamente en consultas SQL. Valida la entrada y utiliza consultas parametrizadas con PDO."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $_GET[$KEY]
          - pattern: $_POST[$KEY]
          - pattern: $_REQUEST[$KEY]
      - pattern-inside: |
          $QUERY = "...";
          ...
          $PDO->query($QUERY);
